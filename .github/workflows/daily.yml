name: daily-habits-reminder
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send WhatsApp via CallMeBot
        env:
          PHONE: ${{ secrets.PHONE }}
          APIKEY: ${{ secrets.APIKEY }}
        run: |
          DATE_HUMAN=$(TZ=America/Merida date +"%a %d %b")
          MSG=$'Hábitos de hoy — '"$DATE_HUMAN"$'\n\n¿Marcaste tus hábitos del día?\n\nhttps://simoneaweround.github.io/simone-habitos/'
          curl -fsSG "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=$PHONE" \
            --data-urlencode "text=$MSG" \
            --data-urlencode "apikey=$APIKEY"
