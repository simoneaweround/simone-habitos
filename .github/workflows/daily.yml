name: daily-habits-reminder
on:
  schedule:
    # 21:30 CST (UTC-6) = 03:30 UTC next day
    - cron: "30 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send WhatsApp via CallMeBot
        run: |
          DATE_HUMAN=$(TZ=America/Merida date +"%a %d %b")
          curl -fsSG "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.PHONE }}" \
            --data-urlencode "text=Hábitos de hoy — ${DATE_HUMAN}

¿Marcaste tus hábitos del día?

https://simoneaweround.github.io/simone-habitos/" \
            --data-urlencode "apikey=${{ secrets.APIKEY }}"
